spring:
  application:
    name: delivery-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # 监听器抛出异常时不再 requeue，避免 SMTP 失败消息无限循环
        default-requeue-rejected: false
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
server:
  port: 8086
app:
  tenant:
    base-url: jdbc:mysql://localhost:3306
    username: root
    password:
    schemas:
      default: tenant_default
  downstream:
    contact-base-url: http://localhost:8082
    template-base-url: http://localhost:8083
    campaign-base-url: http://localhost:8084
    tracking-base-url: http://localhost:8080
  trigger:
    queue: smartmail.campaign.trigger
  send:
    exchange: smartmail.send
    routing-key: send.task
    # 单条投递最大尝试次数（含首次），失败后按间隔重试，耗尽后标记 failed 并停止
    max-attempts: 3
    retry-interval-ms: 30000
    retry-backoff-multiplier: 2.0
    max-retry-interval-ms: 300000
  default:
    from: noreply@smartmail.local
  smtp:
    encryption-key: ""
  channel:
    smtp:
      enabled: true
    api:
      enabled: false
